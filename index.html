<style>
:root{--paper:#F0F7FA;--card:#fff;--ink:#1A1D29;--muted:#6B7280;--line:#D1E3EB;--brand:#0B4F6C;--brand-ink:#fff;--brand-hover:#084059;--accent:#01BAEF;--amber:#F59E0B;--bad:#DC2626;--ok:#15803D;--side:#fff;--side-ink:#1A1D29;--soft:#E3EFF5;--shadow:0 1px 2px rgba(11,79,108,.06),0 8px 24px -12px rgba(11,79,108,.18)}
:root[data-theme=dark]{--paper:#0A1F2E;--card:#10293A;--ink:#E6F0F5;--muted:#8FA9B7;--line:#1F3B4E;--brand:#01BAEF;--brand-ink:#06222F;--brand-hover:#4FD0F5;--bad:#F87171;--ok:#4ADE80;--side:#0D2433;--side-ink:#E6F0F5;--soft:#16354A;--shadow:0 8px 24px -12px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
a{color:var(--brand);font-weight:500}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
textarea{width:100%;min-height:150px;font:13px ui-monospace,Menlo,Consolas,monospace}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 16px;cursor:pointer;white-space:nowrap;font-weight:500;transition:all .15s}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
.btn.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.warn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.sm{padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:progress;transform:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font:600 20px Outfit,sans-serif;color:var(--brand)}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font:700 13px Inter,system-ui;font-style:normal}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;text-align:left;background:none;border:0;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--soft);color:var(--brand);font-weight:600}
.ic{display:inline-grid;place-items:center;flex:none}.ic svg{width:19px;height:19px}
.who{border-top:1px solid var(--line);padding:14px 8px 0;font-size:13px;color:var(--muted)}
.who b{display:block;color:var(--ink);font-size:14px}
.who .btn{margin-top:10px}
.main{padding:32px clamp(16px,4vw,48px) 72px;max-width:1120px;width:100%}
.head{margin-bottom:24px}.head h1{font-size:30px}.head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:12px}
.flash{border-radius:10px;padding:10px 14px;margin-bottom:16px;border:1px solid var(--line);background:var(--card);border-left:4px solid var(--ok)}
.flash.denied{border-left-color:var(--bad)}.flash.invalid{border-left-color:var(--amber)}.flash b{margin-right:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.bar input,.bar select,.bar .btn{height:40px}
.list{display:flex;flex-direction:column;gap:10px}
.doc{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;transition:all .18s}
.doc:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.doc-main{flex:1;min-width:0;display:flex;flex-direction:column}
.doc-main strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.ft{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:700 11px Inter,system-ui;background:var(--soft);color:var(--brand);flex:none}
.chip{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.owner,.chip.ALLOWED{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.edit{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--ink)}
.chip.DENIED,.chip.REJECTED{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(10,31,46,.45);backdrop-filter:blur(2px);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--paper);z-index:21;overflow-y:auto;padding:24px;box-shadow:-12px 0 40px rgba(10,31,46,.2);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
.drawer h2{font-size:22px;word-break:break-word}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin:8px 0 14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tile i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-style:normal;color:#fff}
.tile.c0 i{background:var(--amber)}.tile.c1 i{background:var(--brand);color:var(--brand-ink)}.tile.c2 i{background:var(--accent)}.tile.c3 i{background:#8B5CF6}
.tile b{font:600 26px/1.1 Outfit,sans-serif;display:block}.tile div span{color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.seg .btn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cols ul{margin:8px 0 0;padding-left:18px}.cols li{margin:4px 0}
.no{color:var(--bad)}
.gate{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr 1fr}
.gate-l{position:relative;overflow:hidden;background:linear-gradient(135deg,#F0F7FA,#E3EFF5 60%,#fff);padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:20px}
.gate-l::before,.gate-l::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;z-index:0}
.gate-l::before{width:260px;height:260px;background:#01BAEF;top:-60px;left:-40px}
.gate-l::after{width:300px;height:300px;background:#0B4F6C;bottom:-90px;right:-60px;opacity:.2}
.gate-l>*{position:relative;z-index:1}
.gate-l h1{font-size:clamp(32px,4.2vw,52px);line-height:1.1;color:#0B4F6C}
.gate-l p{margin:0;max-width:46ch;color:#4B5563;font-size:17px}
.gate-l ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.gate-l li{background:#fff;border:1px solid #D1E3EB;border-radius:14px;padding:12px 16px;color:#1A1D29;box-shadow:0 8px 24px -14px rgba(11,79,108,.25);border-left:4px solid #0B4F6C}
.gate-l li:nth-child(2){border-left-color:#01BAEF}.gate-l li:nth-child(3){border-left-color:#20BF55}
.gate-r{display:grid;place-items:center;padding:24px;background:var(--paper)}
.gate-r .card{width:min(430px,100%);padding:28px}
.stack{display:grid;gap:12px}
pre.src{background:var(--soft);border-radius:12px;padding:12px;overflow:auto;max-height:560px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:16px;background:var(--card)}
.empty b{color:var(--ink);font:600 17px Outfit,sans-serif}
.empty .ic svg{width:34px;height:34px;color:var(--brand)}
.setup{max-width:640px;margin:8vh auto;padding:0 16px}
.setup code{background:var(--soft);border-radius:6px;padding:1px 6px}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:11px 14px;box-shadow:0 12px 30px -10px rgba(10,31,46,.35);animation:pop .2s ease-out}
.toast.denied{border-left-color:var(--bad)}.toast.invalid{border-left-color:var(--amber)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
body.busy::before{content:"";position:fixed;top:0;left:0;height:3px;width:40%;background:var(--accent);z-index:60;animation:bar 1s ease-in-out infinite}
@keyframes bar{from{left:-40%}to{left:100%}}
.skel-b{height:78px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#root:empty::after{content:"";display:block;width:34px;height:34px;margin:30vh auto 0;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}
 .logo{padding:0}
 .who{border:0;padding:0;display:flex;gap:10px;align-items:center}.who b{display:inline;font-size:13px}.who .btn{margin:0}
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:15;flex-direction:row;justify-content:space-around;gap:0;background:var(--side);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex:none}
 .nav button{flex:1;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 8px;text-align:center}
 .who span,.who br{display:none}.who b{white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
 .bar{display:grid;grid-template-columns:1fr 1fr}.bar .fld:first-child{grid-column:1/-1}.bar input,.bar select,.bar .btn{width:100%}
 .main{padding:20px 16px 96px}.head h1{font-size:24px}
 .gate{grid-template-columns:1fr}.gate-l{padding:28px 20px}
 .toasts{bottom:78px}.drawer{padding:18px}
}
[hidden]{display:none!important}
.ask summary{cursor:pointer;font:600 17px Outfit,sans-serif;list-style:none}.ask summary::-webkit-details-marker{display:none}.ask[open] summary{margin-bottom:14px}
.pill{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.notice{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));background:color-mix(in srgb,var(--amber) 12%,var(--card));border-radius:14px;padding:14px 16px;margin-bottom:16px}
.notice.ok{border-color:var(--line);background:var(--card)}
.notice .ic svg{width:22px;height:22px;color:var(--brand)}
.notice b{display:block}.notice span{color:var(--muted);font-size:14px}
.stack textarea{min-height:100px}.stack>.fld,.bar .fld{flex:1}
.help{display:grid;grid-template-columns:minmax(270px,360px) 1fr;gap:16px;align-items:start}
.help>div:first-child{display:grid;gap:10px;min-width:0}
.tklist{display:grid;gap:8px;max-height:560px;overflow-y:auto;overflow-x:hidden}
.tk{position:relative;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:all .15s}
.tk:hover{border-color:var(--brand)}.tk.on{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 20%,transparent)}
.tk-main{display:flex;flex-direction:column;min-width:0}.tk-main strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-side{display:flex;flex-wrap:wrap;gap:6px}
.dot{position:absolute;top:10px;left:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.thread{margin:0}.th-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.th-head h2{font-size:19px;margin:0}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:160px;max-height:480px;overflow-y:auto;padding:4px 2px 12px}
.msg{max-width:86%}.msg.me{align-self:flex-end}
.who2{font-size:12px;font-weight:600;margin-bottom:3px}.who2 span{color:var(--muted);font-weight:400}
.bubble{background:var(--soft);border-radius:14px 14px 14px 4px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.msg.me .bubble{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 4px 14px}
.msg.me .who2{text-align:right}
.reply{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}.reply textarea{min-height:110px;resize:vertical;font:15px/1.5 Inter,system-ui,sans-serif}.reply .btn{justify-self:end}
.mem{display:flex;align-items:center;gap:12px;margin:0;flex-wrap:wrap}.mem-main{display:flex;flex-direction:column;flex:1;min-width:120px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font:600 17px Outfit,sans-serif;flex:none}
@media(max-width:820px){.help{grid-template-columns:1fr}.msg{max-width:94%}}
:root{--glow:0 0 0 1px rgba(1,186,239,.30),0 12px 32px -12px rgba(1,186,239,.38);--spot:rgba(1,186,239,.10)}

body,.card,.side,.cmdk,.tile,.doc{transition:background-color .25s,color .25s,border-color .25s,box-shadow .25s,transform .2s}
.card,.tile,.doc,.tk,.mem,.rw{position:relative}
.card::before,.tile::before,.doc::before,.tk::before,.mem::before,.lg-sec::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--spot),transparent 65%);opacity:0;transition:opacity .25s;pointer-events:none}

.btn.pri:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent),0 8px 24px -6px rgba(1,186,239,.55)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent),0 0 18px -4px rgba(1,186,239,.5)}
.ghost{background:none;border:0;border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;position:relative;transition:all .15s;padding:0}

.av{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600;flex:none;box-shadow:0 0 0 2px var(--card),0 4px 12px -4px var(--a)}
.app{transition:grid-template-columns .25s ease}
.app.mini{grid-template-columns:78px 1fr}
.logo{justify-content:space-between}.logo .lt{flex:1}
.nav button.on{box-shadow:inset 3px 0 0 var(--accent),0 0 24px -8px rgba(1,186,239,.55)}

.who{display:flex;align-items:center;gap:8px;font-size:13px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-10px 0 22px}

.tb-right{display:flex;align-items:center;gap:6px}

                       Every rule is enforced IN THE DATABASE (see schema.sql),
                       on every call, from stored data - never by this page.
   2. Screens        - draw the result.
   ===================================================================== */

/* ---------- your Supabase project ---------- */
const SUPABASE_URL = 'https://qayskluqsjpgvjorinnc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFheXNrbHVxc2pwZ3Zqb3Jpbm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NzYzMTQsImV4cCI6MjEwOTM1MjMxNH0.JfEvMy4cafpY0b7PhlQiWYPN-ipWa_7_LaBQv46ZUuU';   // Project Settings -> API -> anon public (safe to publish)

const enc = new TextEncoder();
const toB64 = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };

class Forbidden extends Error {}
class BadInput extends Error {}

/* ---------- file rules (early feedback; the database enforces the rest) ---------- */
const KINDS = { txt: 'text/plain', md: 'text/markdown', csv: 'text/csv', json: 'application/json', pdf: 'application/pdf', png: 'image/png' };
const TEXTY = new Set(['txt', 'md', 'csv', 'json']);
const LIMIT = 3 * 1024 * 1024;
const CATEGORIES = ['Contract', 'HR', 'Finance', 'Engineering', 'Audit', 'Other'];
function vetName(name) {
  if (typeof name !== 'string' || !/^[\w\-. ()]{1,100}$/.test(name) || name.includes('..') || name.startsWith('.')) throw new BadInput('File name: 1-100 characters; letters, digits, space, dot, dash, underscore and brackets only.');
  const ext = extOf(name);
  if (!KINDS[ext]) throw new BadInput(`.${ext} files are not accepted (allowed: ${Object.keys(KINDS).join(', ')}).`);
  return ext;
}
function vetFile(name, bytes, cat) {
  const ext = vetName(name);
  if (!bytes.length) throw new BadInput('The file is empty.');
  if (bytes.length > LIMIT) throw new BadInput('The file is bigger than 3 MB.');
  if (!CATEGORIES.includes(cat)) throw new BadInput('Choose one of the listed categories.');
  const head = (sig) => sig.every((b, i) => bytes[i] === b);
  if (ext === 'pdf' && !head([0x25, 0x50, 0x44, 0x46, 0x2d])) throw new BadInput('The content is not a real PDF.');
  if (ext === 'png' && !head([0x89, 0x50, 0x4e, 0x47])) throw new BadInput('The content is not a real PNG.');
  if (TEXTY.has(ext)) {
    let t; try { t = new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch { throw new BadInput('The text is not valid UTF-8.'); }
    if (t.includes('\0')) throw new BadInput('Binary data found inside a text file.');
    if (ext === 'json') { try { JSON.parse(t); } catch { throw new BadInput('This is not valid JSON.'); } }
  }
  return ext;
}

/* ---------- calling the database ---------- */
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) {
    if (error.code === '42501' || error.code === 'PGRST301' || /jwt/i.test(error.message || '')) throw new Forbidden('Your session has ended. Please sign in again.');
    console.error(error);
    throw new Error('Server error: ' + (error.message || 'unknown'));
  }
  if (data && data.ok === false) throw data.kind === 'invalid' ? new BadInput(data.message) : new Forbidden(data.message);
  return data;
}

/* ---------- the Vault service ---------- */
const Vault = {
  async signIn(email, pw) {
    email = String(email || '').trim().toLowerCase();
    const { error } = await sb.auth.signInWithPassword({ email, password: String(pw || '') });
    if (error) {
      const why = /banned/i.test(error.message) ? 'account deactivated' : /confirm/i.test(error.message) ? 'email not confirmed' : /too many|rate/i.test(error.message) ? 'rate limited' : 'wrong email or password';
      try { await sb.rpc('log_failed_login', { p_email: email, p_reason: why }); } catch { /* logging is best effort */ }
      if (/banned/i.test(error.message)) throw new Forbidden('This account has been deactivated.');
      if (/confirm/i.test(error.message)) throw new Forbidden('Please confirm your email address first (check your inbox).');
      if (/too many|rate/i.test(error.message)) throw new Forbidden('Too many attempts. Wait a few minutes.');
      throw new Forbidden('Invalid credentials');
    }
    try { return await rpc('login_check'); }
    catch (e) { await sb.auth.signOut({ scope: 'local' }); throw e; }
  },
  async signUp(f) {
    const name = String(f.name || '').trim(), username = String(f.username || '').trim().toLowerCase(), email = String(f.email || '').trim(), pw = String(f.pw || '');
    if (name.length < 2 || name.length > 60) throw new BadInput('Enter your full name (2-60 characters).');
    if (!/^[a-z0-9_.-]{3,30}$/.test(username)) throw new BadInput('Username: 3-30 characters of a-z, 0-9, dot, dash or underscore.');
    if (!/^\S+@\S+\.\S+$/.test(email)) throw new BadInput('Enter a valid email address.');
    if (!['owner', 'viewer'].includes(f.role)) throw new BadInput('Register as a document owner or a viewer. Administrators are created by administrators.');
    if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) throw new BadInput('Password: 8+ characters with at least one letter and one digit.');
    try {
      const { data: free, error: ue } = await sb.rpc('username_available', { p_username: username });
      if (!ue && free === false) throw new BadInput('That username is already taken. Please choose another.');
    } catch (e) { if (e instanceof BadInput) throw e; }
    const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { name, username, role: f.role } } });
    if (error) {
      if (/already/i.test(error.message)) throw new BadInput('That email is already registered.');
      if (/database error/i.test(error.message)) throw new BadInput('That username is taken (or the details are not valid).');
      throw new BadInput(error.message);
    }
    if (data.user && data.user.identities && data.user.identities.length === 0) throw new BadInput('That email is already registered.');
    await sb.auth.signOut({ scope: 'local' });   // a new account must wait for approval
  },
  async signOut() {
    try { await rpc('logout'); } catch { /* already gone */ }
    try { await sb.auth.signOut({ scope: 'global' }); } catch { /* ignore */ }
  },
  me: () => rpc('me'),
  directory: () => rpc('directory'),
  list: (f = {}) => rpc('list_documents', { p_q: f.q || null, p_owner: f.owner || null, p_category: f.category || null, p_from: f.from || null, p_to: f.to || null }),
  // Files live in the database. Opening, downloading, editing and deleting are server functions that
  // check access AND write the audit entry together. There is no quiet read and no direct file route.
  async inspect(id) {
    const r = await rpc('inspect_document', { p_id: id });
    return { meta: r.meta, text: r.text == null ? null : r.text, editors: r.editors || [], grants: r.grants, trail: r.trail };
  },
  async details(id) {            // no file content, so no READ entry; used to keep an open drawer fresh
    const r = await rpc('doc_details', { p_id: id });
    return { meta: r.meta, editors: r.editors || [], grants: r.grants, trail: r.trail };
  },
  async download(id) {
    const r = await rpc('download_document', { p_id: id });
    return { name: r.name, blob: new Blob([fromB64(r.data)], { type: KINDS[r.ext] }) };
  },
  async upload({ name, bytes, category, visibility, editors }) {
    vetFile(name, bytes, category);          // early feedback only; the server checks everything again
    if (!['everyone', 'private'].includes(visibility)) throw new BadInput('Pick who can view the document.');
    const c = await rpc('create_document', { p_name: name, p_category: category, p_visibility: visibility, p_editors: editors || [], p_data: toB64(bytes) });
    return c.id;
  },
  async edit(id, { name, category, text, expected, current }) {
    vetName(name);
    if (!CATEGORIES.includes(category)) throw new BadInput('Choose one of the listed categories.');
    let p_text = null;
    if (text != null && text !== current) { vetFile(name, enc.encode(text), category); p_text = text; }
    return rpc('commit_edit', { p_id: id, p_name: name, p_category: category, p_expected: expected, p_text });

    vetFile(name, bytes, 'Other');

  remove: (id) => rpc('remove_document', { p_id: id }),
  setVisibility: (id, v) => rpc('set_visibility', { p_id: id, p_v: v }),
  grant: (id, user, perm) => rpc('grant_access', { p_id: id, p_user: user, p_perm: perm }),
  revoke: (id, user) => rpc('revoke_access', { p_id: id, p_user: user }),
  /* administrator duties (never document contents) */
  admin: () => rpc('admin_overview'),
  decide: (target, approve, owner) => rpc('decide', { p_target: target, p_approve: approve, p_owner: owner || null }),
  setRole: (target, role) => rpc('set_role', { p_target: target, p_role: role }),

  verify: () => rpc('verify_log'),

  helpStatus: (id, status) => rpc('help_status', { p_ticket: id, p_status: status }),
  team: () => rpc('my_team'),
  adminPeople: () => rpc('admin_people'),
  assignOwner: (target, owner) => rpc('assign_owner', { p_target: target, p_owner: owner }),
};

const root = document.getElementById('root');
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);

    else if (k === 'class') e.className = v;
    else if (v === true) e.setAttribute(k, '');

  }

};

const size = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);

    } }, lab('Subject', subject), h('div', { class: 'bar' }, lab('Category', category), lab('Priority', priority)), lab('Message', body),

(async () => {
